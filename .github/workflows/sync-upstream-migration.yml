name: Sync upstream/migration (build-gated)

on:
  repository_dispatch:
    types: [upstream-migration-push]
  workflow_dispatch:

concurrency:
  group: sync-upstream-migration
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration
          fetch-depth: 0

      - name: Merge upstream/migration
        id: merge
        run: |
          git remote add upstream https://github.com/tartarixinc/TScopier.git 2>/dev/null || true
          git fetch upstream migration
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BEFORE=$(git rev-parse HEAD)
          if git merge --no-edit upstream/migration; then
            AFTER=$(git rev-parse HEAD)
            if [ "$BEFORE" = "$AFTER" ]; then
              echo "changed=nothing" >> "$GITHUB_OUTPUT"
            else
              echo "changed=merged" >> "$GITHUB_OUTPUT"
            fi
          else
            git merge --abort || true
            echo "changed=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Report merge conflict
        if: steps.merge.outputs.changed == 'conflict'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'auto-sync: upstream/migration merge conflict';
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', per_page: 100
            });
            const match = open.find(i => i.title === title && !i.pull_request);
            const body = `Automatic sync could not merge \`upstream/migration\` into \`migration\` (conflict). Please merge manually and push. Trigger: ${context.payload.client_payload?.sha || 'manual dispatch'}.`;
            if (match) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: match.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }
            core.setFailed('merge conflict');

      - name: Set up Node
        if: steps.merge.outputs.changed == 'merged'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.merge.outputs.changed == 'merged'
        run: npm ci

      - name: Build (tsc + vite)
        if: steps.merge.outputs.changed == 'merged'
        id: build
        run: |
          if npm run build; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report build failure
        if: steps.merge.outputs.changed == 'merged' && steps.build.outputs.ok != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'auto-sync: merged upstream/migration fails the build';
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', per_page: 100
            });
            const match = open.find(i => i.title === title && !i.pull_request);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Merge of \`upstream/migration\` breaks \`npm run build\`. Nothing was pushed. Fix the branch manually, then re-run. Failed run: ${runUrl}\n\nTrigger: ${context.payload.client_payload?.sha || 'manual dispatch'}.`;
            if (match) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: match.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }
            core.setFailed('build failed after merge');

      - name: Push to origin/migration
        if: steps.merge.outputs.changed == 'merged' && steps.build.outputs.ok == 'true'
        run: git push origin migration
